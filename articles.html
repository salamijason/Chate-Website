<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Articles - ချိတ်</title>
    <link rel="canonical" href="https://chatethehook.com/articles.html" />
    <meta
      name="description"
      content="Scholarship guides, admissions advice, and testing tips for Myanmar students applying abroad."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/logos/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:title" content="Articles - ချိတ် - The Hook" />
    <meta
      property="og:description"
      content="Scholarship guides, admissions advice, and testing tips for Myanmar students applying abroad."
    />
    <meta
      property="og:image"
      content="https://chatethehook.com/assets/logos/og-preview.webp"
    />
    <meta property="og:url" content="https://chatethehook.com/articles.html" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="my_MM" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Articles - ချိတ် - The Hook" />
    <meta
      name="twitter:description"
      content="Scholarship guides, admissions advice, and testing tips for Myanmar students applying abroad."
    />
    <meta
      name="twitter:image"
      content="https://chatethehook.com/assets/logos/og-preview.webp"
    />

    <!-- Import Map for DOMPurify -->
    <script type="importmap">
      {
        "imports": {
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.es.mjs"
        }
      }
    </script>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- Google Fonts: Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Site Header -->
    <header id="navbar" class="site-header" data-component="navbar"></header>

    <!-- Category Filter Buttons -->
    <div class="container-fluid background-gray pb-3">
      <nav class="locationbuttongrp p-3" aria-label="Article category filter">
        <button id="scholarships-button" class="selector clicked" type="button">
          Scholarships
        </button>
        <button
          id="testing-and-curriculum-button"
          class="selector"
          type="button"
        >
          Testing & Curriculum
        </button>
        <button id="uk-button" class="selector" type="button">UK</button>
        <button id="us-button" class="selector" type="button">US</button>
        <button id="about-chate-button" class="selector" type="button">
          About
          <span class="fw-bold"> ချိတ် </span>
        </button>
        <button id="all-articles-button" class="selector" type="button">
          All Articles
        </button>
      </nav>
    </div>

    <!-- Article Listing Panel (populated by articles.js) -->
    <main class="container-fluid background-gray px-2 px-md-5 pb-4">
      <div
        class="justify-content-center p-2 d-flex"
        style="padding-right: 50px"
      >
        <h1>
          ALL
          <span class="textaccent text-center" id="articles-header-text"
            >Scholarships</span
          >
        </h1>
      </div>
      <div
        class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 m-2"
        id="articles-panel"
      ></div>
      <div class="text-center" id="moreSection">
        <button
          type="button"
          class="btn btn-primary selector"
          id="moreContent"
          aria-label="Load more articles"
        >
          More
        </button>
      </div>
    </main>

    <!-- Site Footer -->
    <footer id="footer" class="site-footer" data-component="footer"></footer>

    <!-- Page-Specific Script -->
    <script type="module" src="js/pages/articles.js"></script>

    <!-- Third-Party Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/1c1ce0b05a.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
